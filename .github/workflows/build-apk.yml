name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [[ -z "${JAVA_HOME:-}" ]]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi
          java -version
          VERSION_LINE=$(java -version 2>&1 | head -n 1)
          RAW_VERSION=$(echo "$VERSION_LINE" | sed -nE 's/.*version "([^"]+)".*/\1/p')
          if [[ -z "$RAW_VERSION" ]]; then
            echo "::error::Unable to detect active Java version from: $VERSION_LINE"
            exit 1
          fi
          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F. '{ if ($1 == "1") print $2; else print $1 }')
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse Java major version from: $RAW_VERSION"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VERSION"
          if (( MAJOR_VERSION < 17 )); then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [[ -f ./debug.keystore ]]; then
            echo "Existing ./debug.keystore found; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [[ ! -x "$KEYTOOL_BIN" ]]; then
              echo "::error::keytool not found in configured Java 17 installation ($JAVA_HOME)."
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi
          if [[ ! -f ./debug.keystore || ! -s ./debug.keystore ]]; then
            echo "::error::Temporary ./debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -e "$APK_PATH" ]]; then
            echo "::error::Expected debug APK not found at $APK_PATH"
            if [[ -d "app/build/outputs/apk" ]]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [[ ! -f "$APK_PATH" || ! -s "$APK_PATH" || "${APK_PATH##*.}" != "apk" ]]; then
            echo "::error::Verified path $APK_PATH is not a valid non-empty .apk file."
            exit 1
          fi
          echo "Verified debug APK: $APK_PATH"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$SOURCE_APK" || ! -s "$SOURCE_APK" ]]; then
            echo "::error::Source debug APK is missing or empty: $SOURCE_APK"
            exit 1
          fi
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          if [[ -z "$SAFE_REPO_NAME" ]]; then
            SAFE_REPO_NAME="android-app"
          fi
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_ASSET_DIR=$(mktemp -d "${RUNNER_TEMP}/release-apk-XXXXXX")
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"
          cp "$SOURCE_APK" "$ASSET_PATH"
          if [[ ! -f "$ASSET_PATH" || ! -s "$ASSET_PATH" || "${ASSET_PATH##*.}" != "apk" ]]; then
            echo "::error::Prepared release asset is invalid: $ASSET_PATH"
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [[ ! -f "$ASSET_PATH" || ! -s "$ASSET_PATH" || "${ASSET_PATH##*.}" != "apk" ]]; then
            echo "::error::Prepared release asset is missing or not a valid non-empty .apk file."
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(printf '%s\n' \
            "Automatically generated debug APK built by GitHub Actions." \
            "" \
            "- **Workflow Run Number**: ${GITHUB_RUN_NUMBER}" \
            "- **Workflow Run Attempt**: ${GITHUB_RUN_ATTEMPT}" \
            "- **Source Commit SHA**: ${GITHUB_SHA}" \
            "- **Purpose**: Intended for testing only (not a Google Play Store production release)." \
            "- **Signing**: Signed only with a temporary debug keystore.")
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always() && steps.prepare_asset.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [[ "${{ steps.publish_release.outcome }}" == "success" ]]; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            {
              echo "## Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Title**: ${RELEASE_TITLE}"
              echo "- **Release Tag**: \`${RELEASE_TAG}\`"
              echo "- **APK Asset**: \`${ASSET_NAME}\`"
              echo "- **Download Page**: ${RELEASE_URL}"
              echo ""
              echo "Download the APK directly from the **Assets** section of the GitHub Release above. The GitHub Actions artifact \`app-debug-apk\` is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build and artifact upload succeeded."
            echo "Backup Actions artifact name: app-debug-apk"
            {
              echo "## Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Creating the GitHub Release failed, but the APK build completed successfully."
              echo ""
              echo "- **Actions Artifact**: \`app-debug-apk\` remains available in the Artifacts section of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
